name: Deploy to Kubernetes

on:
  push:
    branches:
      - kubernetes
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install
      working-directory: backend

    - name: Create secrets directory and files
      working-directory: backend
      run: |
        mkdir -p ./secrets
        echo "${{ secrets.JWT_AUTH_SECRET }}" > ./secrets/jwt_auth.txt

    - name: Run server
      run: node src/server.js &
      working-directory: backend
      env:
        JWT_SECRET_FILE: ./secrets/jwt_auth.txt

    - name: Wait for server to start
      run: sleep 5

    - name: Run unit tests
      run: npm test unit
      working-directory: backend
      env:
        JWT_SECRET_FILE: ./secrets/jwt_auth.txt

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            wojdeg13/server-panel-backend:${{ github.sha }}
            wojdeg13/server-panel-backend:latest
 
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            wojdeg13/server-panel-front:${{ github.sha }}
            wojdeg13/server-panel-front:latest
 
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Create namespace
        run: kubectl create namespace server-panel
 
      - name: Install Nginx Ingress
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          sleep 10

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f ./k8s/ -n server-panel
 
      - name: Deploy backend to Kubernetes
        run: |
          kubectl set image deployment/backend backend=wojdeg13/server-panel-backend:${{ github.sha }} -n server-panel
          kubectl rollout status deployment/backend -n server-panel --timeout=120s
 
      - name: Deploy frontend to Kubernetes
        run: |
          kubectl set image deployment/frontend frontend=wojdeg13/server-panel-front:${{ github.sha }} -n server-panel
          kubectl rollout status deployment/frontend -n server-panel --timeout=120s
 
      - name: Verify deployment health
        run: |
          kubectl get pods -n server-panel
          kubectl get ingress -n server-panel