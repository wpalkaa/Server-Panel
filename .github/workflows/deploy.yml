name: Deploy to Kubernetes

on:
  push:
    branches:
      - kubernetes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v3

      - name: Budowa obrazu Docker
        run: docker build -t wojdeg13/server-panel-backend:v1.0.0 ./backend

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publikacja obrazu
        run: docker push wojdeg13/server-panel-backend:v1.0.0

      - name: Konfiguracja połączenia z klastrem K8s
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Wdrożenie na Kubernetes
        run: |
          kubectl set image deployment/backend backend=wojdeg13/server-panel-backend:${{ github.sha }} -n server-panel
          # To jest kluczowe wymaganie: weryfikacja rolloutu
          kubectl rollout status deployment/backend -n server-panel