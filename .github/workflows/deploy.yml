name: Deploy to Kubernetes

on:
  push:
    branches:
      - kubernetes

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm install
      working-directory: backend

    - name: Run server
      run: node src/server.js &
      working-directory: backend

    - name: Wait for server to start
      run: sleep 5

    - name: Run tests
      run: npm test 
      working-directory: backend

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            wojdeg13/server-panel-backend:${{ github.sha }}
            wojdeg13/server-panel-backend:latest
 
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            wojdeg13/server-panel-front:${{ github.sha }}
            wojdeg13/server-panel-front:latest
 
      - name: Configure kubectl
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
 
      - name: Deploy backend to Kubernetes
        run: |
          kubectl set image deployment/backend backend=wojdeg13/server-panel-backend:${{ github.sha }} -n server-panel
          kubectl rollout status deployment/backend -n server-panel --timeout=120s
 
      - name: Deploy frontend to Kubernetes
        run: |
          kubectl set image deployment/frontend frontend=wojdeg13/server-panel-front:${{ github.sha }} -n server-panel
          kubectl rollout status deployment/frontend -n server-panel --timeout=120s
 
      - name: Verify deployment health
        run: |
          kubectl get pods -n server-panel
          kubectl get ingress -n server-panel