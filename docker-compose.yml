services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    networks:
      - proxy-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf    
    depends_on:
      - frontend
      - backend
      - redis
      - mqtt
      - adminer
      - mongodb
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend
    networks:
      - proxy-net
    env_file:
      - .env.frontend
      - .env.secret.frontend
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    env_file:
      - .env.backend
      - .env.secret.backend
    networks:
      - proxy-net
      - app-net
      - db-net
    secrets:
      - db_user
      - db_password
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 1m30s
  
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-net
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.20'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  mongodb:
    image: mongo
    container_name: mongodb
    volumes:
      - ./backend/data:/data/db
    networks:
      - db-net
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  adminer:
    image: adminer:latest
    container_name: adminer
    networks:
      - db-net
      - proxy-net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mqtt:
    image: eclipse-mosquitto
    container_name: mqtt
    networks:
      - proxy-net
    ports:
      - "1883:1883"
    volumes:
      - ./backend/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:

networks:
  proxy-net:
    ipam:
      config:
        - subnet: 172.0.0.0/24
          gateway: 172.0.0.1
  
  db-net:
    ipam:
      config:
        - subnet: 172.0.1.0/24
          gateway: 172.0.1.1
  
  app-net:
    ipam:
      config:
        - subnet: 172.0.2.0/24
          gateway: 172.0.2.1

secrets:
  db_user:
    file: ./secrets/db_user.txt
  db_password:
    file: ./secrets/db_password.txt