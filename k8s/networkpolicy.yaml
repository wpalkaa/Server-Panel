apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: server-panel
spec:
  podSelector:
    matchLabels:
      io.kompose.service: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: nginx
      ports:
        - protocol: TCP
          port: 3000
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: frontend
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: redis
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: mongodb
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: mqtt
    - to: []  # Allow DNS
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: server-panel
spec:
  podSelector:
    matchLabels:
      io.kompose.service: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              io.kompose.service: nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              io.kompose.service: backend
      ports:
        - protocol: TCP
          port: 3000
    - to: []
      ports:
        - protocol: UDP
          port: 53