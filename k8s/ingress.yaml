apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: server-panel
spec:
  ingressClassName: nginx
  rules:
    - host: server-panel.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
